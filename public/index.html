<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Solvra Hydraulics — Oil & Gas Pipeline Modeling. Coming soon." />
  <title>Solvra Hydraulics — Coming Soon</title>
  <style>
    :root {
      --bg: #18232D;
      --panel: #202E39;
      --text: #E7EEF3;
      --muted: #A9B8C3;
      --accent: #2C86C7;
      --accent-bright: #4AA3DF;
      --border: #364B5A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 30%, rgba(44,134,199,.16), transparent 38%),
        linear-gradient(180deg, #18232D 0%, #121B23 100%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(760px, 100%);
      text-align: center;
      padding: 64px 32px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border: 2px solid var(--accent-bright);
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: var(--accent-bright);
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -4px;
      box-shadow: 0 0 32px rgba(74,163,223,.18);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: .95;
      letter-spacing: .08em;
      font-weight: 700;
    }
    .hydraulics {
      margin-top: 10px;
      color: var(--accent-bright);
      font-size: clamp(1rem, 3vw, 1.45rem);
      letter-spacing: .34em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .tagline {
      margin: 32px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      letter-spacing: .03em;
    }
    .coming {
      display: inline-block;
      margin-top: 42px;
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: rgba(32,46,57,.62);
      font-size: .95rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    footer {
      position: fixed;
      left: 0; right: 0; bottom: 18px;
      text-align: center;
      color: #748694;
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>SOLVRA</h1>
    <div class="hydraulics">Hydraulics</div>
    <p class="tagline">Oil &amp; Gas Pipeline Modeling</p>
    <div class="coming">Coming Soon</div>
  </main>
  <footer>&copy; 2026 Solvra Hydraulics</footer>
</body>
</html>
